<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tokage Search</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #081426;
            --bg2: #0d1c33;
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --sub: #94a3b8;
            --accent: #38bdf8;
            --accent2: #818cf8;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            color: var(--text);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Hiragino Kaku Gothic ProN",
                "Yu Gothic",
                Meiryo,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(56, 189, 248, 0.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    var(--bg),
                    var(--bg2)
                );
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(
                    rgba(148, 163, 184, 0.16) 1px,
                    transparent 1px
                );

            background-size: 25px 25px;
            opacity: 0.35;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;

            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 30px;

            border-bottom: 1px solid var(--border);

            background: rgba(8, 20, 38, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            z-index: 10;
        }

        .brand-small {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-small span {
            color: var(--accent);
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            color: var(--sub);
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        nav a:hover {
            color: white;
        }

        main {
            position: relative;
            z-index: 2;

            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 80px 20px;
        }

        .content {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .logo-mark {
            width: 72px;
            height: 72px;

            margin: 0 auto 22px;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    rgba(56, 189, 248, 0.95),
                    rgba(129, 140, 248, 0.95)
                );

            box-shadow:
                0 15px 50px rgba(56, 189, 248, 0.18);
        }

        h1 {
            font-size: clamp(42px, 8vw, 76px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -3px;

            background:
                linear-gradient(
                    100deg,
                    #ffffff,
                    #bae6fd 45%,
                    #a5b4fc
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 17px;
            margin-bottom: 32px;

            color: var(--sub);
            font-size: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;

            width: 100%;
            min-height: 66px;

            padding: 7px;

            border-radius: 20px;

            background: rgba(15, 31, 52, 0.85);

            border: 1px solid rgba(148, 163, 184, 0.24);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.28);

            transition: 0.25s;
        }

        .search-box:focus-within {
            border-color: rgba(56, 189, 248, 0.65);

            box-shadow:
                0 0 0 4px rgba(56, 189, 248, 0.08),
                0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .search-icon {
            width: 52px;
            font-size: 23px;
            color: #7dd3fc;
        }

        #urlInput {
            flex: 1;
            min-width: 0;

            height: 50px;

            border: none;
            outline: none;

            background: transparent;

            color: white;
            font-size: 16px;
        }

        #urlInput::placeholder {
            color: #64748b;
        }

        .search-button {
            height: 50px;

            padding: 0 25px;

            border: none;
            border-radius: 15px;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #0ea5e9,
                    #6366f1
                );

            transition: 0.2s;
        }

        .search-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .quick-title {
            margin-top: 34px;
            margin-bottom: 13px;

            color: #64748b;
            font-size: 12px;
        }

        .quick-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .quick-link {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 9px 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: rgba(15, 31, 52, 0.55);

            color: #cbd5e1;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;
        }

        .quick-link:hover {
            background: rgba(30, 58, 90, 0.7);
            border-color: rgba(56, 189, 248, 0.35);
            transform: translateY(-1px);
        }

        .quick-icon {
            font-size: 16px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;

            height: 54px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;

            color: #64748b;
            font-size: 11px;

            z-index: 5;

            pointer-events: none;
        }

        @media (max-width: 600px) {

            header {
                padding: 0 18px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 12px;
            }

            main {
                padding: 80px 15px;
            }

            .logo-mark {
                width: 62px;
                height: 62px;
                font-size: 32px;
            }

            h1 {
                letter-spacing: -2px;
            }

            .search-box {
                min-height: 60px;
                border-radius: 17px;
            }

            .search-icon {
                width: 42px;
            }

            #urlInput {
                font-size: 14px;
            }

            .search-button {
                padding: 0 17px;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="brand-small">
        🦎 <span>Tokage</span> Search
    </div>

    <nav>
        <a href="/">検索</a>
        <a href="/youtube.html">YouTube</a>
    </nav>

</header>


<main>

    <div class="content">

        <div class="logo-mark">
            🦎
        </div>

        <h1>Tokage Search</h1>

        <p class="subtitle">
            シンプルに、すばやくウェブへアクセス
        </p>


        <form id="proxyForm">

            <div class="search-box">

                <div class="search-icon">
                    🔎
                </div>

                <input
                    type="text"
                    id="urlInput"
                    placeholder="URLを入力してください"
                    autocomplete="off"
                    spellcheck="false"
                    required
                >

                <button
                    type="submit"
                    class="search-button"
                >
                    開く
                </button>

            </div>

        </form>


        <div class="quick-title">
            QUICK ACCESS
        </div>

        <!-- カスタマイズされた QUICK ACCESS ボタン -->
        <div class="quick-links">

            <div
                class="quick-link"
                onclick="location.href='https://klmanga.work/'"
            >
                <span class="quick-icon">📖</span>
                漫画raw1
            </div>

            <div
                class="quick-link"
                onclick="location.href='https://klmanga.work/page/2/'"
            >
                <span class="quick-icon">📚</span>
                漫画raw2
            </div>

            <div
                class="quick-link"
                onclick="location.href='https://web-production-cb9f8.up.railway.app/wkt'"
            >
                <span class="quick-icon">🌿</span>
                わかめ
            </div>

            <div
                class="quick-link"
                onclick="openQuickProxy('https://gogoanime.by/')"
            >
                <span class="quick-icon">🎬</span>
                アニメ
            </div>

            <div
                class="quick-link"
                onclick="location.href='https://padlet.com/akmaron5/ipad-isgc-aaich8o88bopb563'"
            >
                <span class="quick-icon">🚪</span>
                回避部屋
            </div>

        </div>

    </div>

</main>


<footer>

    <span>aotoka</span>

    <span>version 1.1.0</span>

</footer>


<script>

    const form = document.getElementById("proxyForm");
    const input = document.getElementById("urlInput");


    function setURL(url) {
        input.value = url;
        input.focus();
    }

    // プロキシ経由で開くための専用関数（アニメボタン用）
    function openQuickProxy(targetUrl) {
        try {
            const encoded = btoa(
                unescape(
                    encodeURIComponent(targetUrl)
                )
            );
            window.location.href = "/fetch?q=" + encodeURIComponent(encoded);
        } catch (error) {
            alert("URLの変換に失敗しました。");
        }
    }

    form.addEventListener("submit", function(e) {

        e.preventDefault();

        let rawUrl = input.value.trim();

        if (!rawUrl) {
            return;
        }

        try {

            if (
                !rawUrl.startsWith("http://") &&
                !rawUrl.startsWith("https://")
            ) {
                rawUrl = "https://" + rawUrl;
            }

            const target = new URL(rawUrl);

            /*
             * 既存の /fetch に接続
             */
            const encoded = btoa(
                unescape(
                    encodeURIComponent(
                        target.toString()
                    )
                )
            );

            window.location.href =
                "/fetch?q=" +
                encodeURIComponent(encoded);

        }

        catch (error) {

            alert("有効なURLを入力してください。");

        }

    });

</script>

</body>
</html>
