<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1rem;
        }
        .search-box {
            display: flex;
            background: #1e293b;
            border-radius: 50px;
            padding: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 0 20px;
            color: #fff;
            font-size: 1rem;
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        button {
            background: linear-gradient(to right, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        button:hover {
            opacity: 0.9;
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure Proxy</h1>
        <p>アクセスしたいURLを入力してください</p>
        <form action="/proxy" method="GET" class="search-box">
            <input type="text" name="url" placeholder="https://example.com" required autocomplete="off">
            <button type="submit">アクセス</button>
        </form>
    </div>
</body>
</html>
