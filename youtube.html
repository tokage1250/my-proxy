<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokage YouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #081426;
            --bg2: #0d1c33;
            --card: rgba(17, 34, 58, 0.72);
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --sub: #94a3b8;
            --accent: #38bdf8;
            --accent2: #818cf8;
        }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            background: radial-gradient(circle at 50% 25%, rgba(56, 189, 248, 0.10), transparent 32%), linear-gradient(135deg, var(--bg), var(--bg2));
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(rgba(148, 163, 184, 0.16) 1px, transparent 1px);
            background-size: 25px 25px;
            opacity: 0.35;
            pointer-events: none;
        }

        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            background: rgba(8, 20, 38, 0.65);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            z-index: 10;
        }

        .brand { color: white; text-decoration: none; font-size: 18px; font-weight: 700; }
        .brand span { color: var(--accent); }
        .back { color: var(--sub); text-decoration: none; font-size: 14px; cursor: pointer; }
        .back:hover { color: white; }

        main {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            padding: 130px 20px 90px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .youtube-icon {
            width: 70px; height: 48px;
            margin: 0 auto 20px;
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            font-size: 23px;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            box-shadow: 0 15px 45px rgba(56, 189, 248, 0.15);
        }

        h1 {
            font-size: clamp(32px, 7vw, 58px);
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(100deg, white, #bae6fd, #a5b4fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .description {
            color: var(--sub);
            margin-top: 12px;
            font-size: 14px;
        }

        .search-form {
            display: flex;
            align-items: center;
            padding: 7px;
            margin-top: 32px;
            background: rgba(15, 31, 52, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.24);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .search-icon { width: 50px; text-align: center; font-size: 21px; }

        #searchInput {
            flex: 1;
            min-width: 0;
            height: 50px;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
        }

        #searchInput::placeholder { color: #64748b; }

        .search-button {
            height: 50px;
            padding: 0 24px;
            border: none;
            border-radius: 15px;
            color: white;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .hint {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 15px;
        }

        .panel {
            margin-top: 35px;
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(15, 31, 52, 0.55);
            text-align: center;
        }

        .panel-title { color: #cbd5e1; font-size: 14px; margin-bottom: 10px; }
        .panel-text { color: #64748b; font-size: 13px; line-height: 1.7; }

        /* --- 検索結果・再生画面用スタイル --- */
        #results-section, #player-section {
            display: none;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .results-title {
            font-size: 20px;
            font-weight: bold;
            color: white;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .video-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            padding: 15px;
        }

        .video-card-title {
            font-size: 15px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-card-channel {
            font-size: 13px;
            color: var(--sub);
        }

        /* プレイヤー画面 */
        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .player-video-title {
            font-size: 22px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }

        .player-video-channel {
            font-size: 15px;
            color: var(--sub);
            margin-bottom: 20px;
        }

        footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            color: #64748b;
            font-size: 11px;
            pointer-events: none;
            background: rgba(8, 20, 38, 0.65);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        @media (max-width: 600px) {
            header { padding: 0 18px; }
            main { padding: 110px 15px 80px; }
            .search-form { border-radius: 17px; }
            .search-button { padding: 0 17px; }
            #searchInput { font-size: 14px; }
        }
    </style>
</head>
<body>

<header>
    <a href="/" class="brand">🦎 <span>Tokage</span> Search</a>
    <a href="#" class="back" onclick="showHome()">← ホーム</a>
</header>

<main>
    <div class="container">

        <!-- 1. ホーム画面（元の美しい検索UI） -->
        <div id="home-section">
            <div class="title">
                <div class="youtube-icon">▶</div>
                <h1>YouTube</h1>
                <p class="description">Tokage SearchからYouTubeを検索</p>
            </div>

            <form id="youtubeForm" class="search-form" onsubmit="handleSearch(event)">
                <div class="search-icon">🔎</div>
                <input type="text" id="searchInput" placeholder="動画を検索..." autocomplete="off" required>
                <button type="submit" class="search-button">検索</button>
            </form>

            <div class="hint">検索するとサイト内でサムネイル一覧が表示され、直接動画を再生できます</div>

            <div class="panel">
                <div class="panel-title">YouTube Search</div>
                <div class="panel-text">
                    検索キーワードを入力して動画を探せます。<br>
                    動画の再生はこのサイト内で直接行われます。
                </div>
            </div>
        </div>

        <!-- 2. 検索結果画面（サムネイル一覧） -->
        <div id="results-section">
            <div class="results-header">
                <div class="results-title" id="resultsTitle">検索結果</div>
                <button class="search-button" onclick="showHome()" style="height: 38px; padding: 0 16px; font-size: 13px;">再検索</button>
            </div>
            <div class="video-grid" id="videoGrid"></div>
        </div>

        <!-- 3. 動画再生画面（真っ暗にならない embed プレイヤー） -->
        <div id="player-section">
            <div class="results-header">
                <button class="search-button" onclick="showResults()" style="height: 38px; padding: 0 16px; font-size: 13px;">← 検索結果に戻る</button>
            </div>
            <div class="player-wrapper">
                <iframe id="ytPlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="player-video-title" id="playerTitle">動画タイトル</div>
            <div class="player-video-channel" id="playerChannel">チャンネル名</div>
            <div class="panel" style="text-align: left;">
                <div class="panel-title">動画説明</div>
                <div class="panel-text" style="color: #94a3b8;">
                    埋め込み（embed）プレイヤーを使用しているため、サイト内でスムーズに動画が再生されます。
                </div>
            </div>
        </div>

    </div>
</main>

<footer>
    <span>aotoka</span>
    <span>version 1.0.0</span>
</footer>

<script>
    // サンプル動画データ（必要に応じて自由に追加・変更できます）
    const sampleVideos = [
        { id: "jNQXAC9IVRw", title: "Me at the zoo - YouTubeの歴史的な最初の動画", channel: "jawed", views: "3億回視聴" },
        { id: "dQw4w9WgXcQ", title: "Never Gonna Give You Up - Official Music Video", channel: "Rick Astley", views: "14億回視聴" },
        { id: "LXb3EKWsInQ", title: "Costa Rica in 4K 60fps (ULTRA HD)", channel: "Jacob + Katie Schwarz", views: "5000万回視聴" },
        { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE(강남스타일) M/V", channel: "officialpsy", views: "50億回視聴" },
        { id: "ScMzIvxBSi4", title: "Lofi Hip Hop Radio - Beats to Relax/Study to", channel: "Lofi Girl", views: "1億回視聴" },
        { id: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito ft. Daddy Yankee", channel: "Luis Fonsi", views: "83億回視聴" }
    ];

    const homeSection = document.getElementById('home-section');
    const resultsSection = document.getElementById('results-section');
    const playerSection = document.getElementById('player-section');
    const searchInput = document.getElementById('searchInput');
    const videoGrid = document.getElementById('videoGrid');
    const resultsTitle = document.getElementById('resultsTitle');
    const ytPlayer = document.getElementById('ytPlayer');
    const playerTitle = document.getElementById('playerTitle');
    const playerChannel = document.getElementById('playerChannel');

    // 検索実行時の処理
    function handleSearch(e) {
        e.preventDefault();
        const query = searchInput.value.trim();
        if (!query) return;

        resultsTitle.textContent = `「${query}」の検索結果`;
        renderGrid();

        homeSection.style.display = 'none';
        playerSection.style.display = 'none';
        resultsSection.style.display = 'block';
    }

    // サムネイル一覧の描画
    function renderGrid() {
        videoGrid.innerHTML = '';
        sampleVideos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            
            // YouTube公式のサムネイル画像URLを自動生成
            const thumbUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;

            card.innerHTML = `
                <div class="thumbnail-container">
                    <img src="${thumbUrl}" alt="thumbnail" loading="lazy">
                </div>
                <div class="video-info">
                    <div class="video-card-title">${video.title}</div>
                    <div class="video-card-channel">${video.channel} • ${video.views}</div>
                </div>
            `;

            card.onclick = () => playVideo(video);
            videoGrid.appendChild(card);
        });
    }

    // 動画再生画面に切り替え（embed URLを使うことで真っ暗にならず再生可能）
    function playVideo(video) {
        resultsSection.style.display = 'none';
        playerSection.style.display = 'block';

        ytPlayer.src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
        playerTitle.textContent = video.title;
        playerChannel.textContent = `${video.channel} • ${video.views}`;
    }

    // 検索結果画面に戻る
    function showResults() {
        ytPlayer.src = ""; // 再生停止
        playerSection.style.display = 'none';
        resultsSection.style.display = 'block';
    }

    // 最初のホーム画面に戻る
    function showHome() {
        ytPlayer.src = ""; // 再生停止
        resultsSection.style.display = 'none';
        playerSection.style.display = 'none';
        homeSection.style.display = 'block';
        searchInput.value = '';
        searchInput.focus();
    }

    // ページ読み込み時に検索欄へフォーカス
    window.onload = () => {
        searchInput.focus();
    };
</script>

</body>
</html>
