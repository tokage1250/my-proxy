<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokage Search - YouTube</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-color: #1e293b;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #3b82f6;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ヘッダーナビゲーション */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }
        .logo { font-weight: bold; font-size: 18px; color: #a3e635; }
        .back-home { color: var(--text-main); text-decoration: none; font-size: 14px; cursor: pointer; }

        /* 共通コンテナ */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- 1. 初期検索画面 (Home View) --- */
        #home-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 50px;
        }
        .yt-icon {
            background: #3b82f6;
            width: 60px; height: 40px;
            border-radius: 12px;
            display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px;
        }
        .yt-icon::before {
            content: "▶"; color: white; font-size: 20px;
        }
        .title { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
        .subtitle { color: var(--text-sub); font-size: 14px; margin-bottom: 40px; }

        .search-box {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 10px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }
        .search-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        .info-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            max-width: 600px;
            width: 100%;
            margin-top: 20px;
        }
        .info-card h3 { font-size: 16px; margin-bottom: 10px; }
        .info-card p { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

        /* --- 2. 検索結果画面 (Results View) --- */
        #results-view { display: none; }
        .results-header {
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .video-card {
            background: var(--glass-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-card:hover { transform: scale(1.02); background: rgba(255,255,255,0.1); }
        .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            object-fit: cover;
        }
        .video-info { padding: 12px; }
        .video-info h4 { font-size: 15px; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-info p { font-size: 13px; color: var(--text-sub); }

        /* --- 3. 再生画面 (Player View) --- */
        #player-view { display: none; }
        .player-header {
            margin-bottom: 20px;
        }
        .player-container {
            display: flex;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .player-container { flex-direction: column; }
        }
        .main-player {
            flex: 1;
        }
        .iframe-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .iframe-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }
        .player-title { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .player-channel { color: var(--text-sub); font-size: 15px; margin-bottom: 20px; }
        
        .mock-description {
            background: var(--glass-bg);
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        /* フッター */
        footer {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            color: var(--text-sub);
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">🦎 Tokage Search</div>
        <a href="#" class="back-home" onclick="showHome()">← ホーム</a>
    </header>

    <div class="container">
        
        <!-- 1. 初期検索画面 -->
        <div id="home-view">
            <div class="yt-icon"></div>
            <div class="title">YouTube</div>
            <div class="subtitle">Tokage SearchからYouTubeを検索</div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="動画を検索..." onkeypress="handleKeyPress(event)">
                <button class="search-btn" onclick="performSearch()">検索</button>
            </div>

            <div class="info-card">
                <h3>YouTube Search</h3>
                <p>検索キーワードを入力して動画を探せます。<br>動画の再生はこのサイト内で直接行われます。</p>
            </div>
        </div>

        <!-- 2. 検索結果一覧画面 -->
        <div id="results-view">
            <div class="results-header">
                <span id="search-query-display">検索結果</span>
                <button class="search-btn" onclick="showHome()" style="padding: 5px 15px;">再検索</button>
            </div>
            <div class="video-grid" id="videoGrid">
                <!-- ここにJavaScriptでサムネイルが並びます -->
            </div>
        </div>

        <!-- 3. 動画再生画面 -->
        <div id="player-view">
            <div class="player-header">
                <button class="search-btn" onclick="showResults()" style="padding: 5px 15px;">← 検索結果に戻る</button>
            </div>
            <div class="player-container">
                <div class="main-player">
                    <!-- ここにYouTubeの埋め込み用iframeが入ります -->
                    <div class="iframe-wrapper">
                        <iframe id="yt-player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <div class="player-title" id="player-title">動画のタイトル</div>
                    <div class="player-channel" id="player-channel">チャンネル名</div>
                    <div class="mock-description">
                        概要欄やコメントがここに表示されます。<br>
                        このプレイヤーはiframe機能を使って正しく再生されるように設定されています。
                    </div>
                </div>
            </div>
        </div>

    </div>

    <footer>
        <div>aotoka</div>
        <div>version 1.0.0</div>
    </footer>

    <script>
        // サンプルの動画データ（検索結果として表示されるダミーデータです。自由にIDを変えられます）
        const dummyVideos = [
            { id: "jNQXAC9IVRw", title: "Me at the zoo (YouTube最初の動画)", channel: "jawed", views: "3億回視聴" },
            { id: "dQw4w9WgXcQ", title: "Rick Astley - Never Gonna Give You Up", channel: "Rick Astley", views: "14億回視聴" },
            { id: "LXb3EKWsInQ", title: "コスタリカの絶景 4K 60fps", channel: "Jacob + Katie Schwarz", views: "5000万回視聴" },
            { id: "9bZkp7q19f0", title: "PSY - GANGNAM STYLE", channel: "officialpsy", views: "50億回視聴" }
        ];

        // 各画面の要素を取得
        const homeView = document.getElementById('home-view');
        const resultsView = document.getElementById('results-view');
        const playerView = document.getElementById('player-view');
        const searchInput = document.getElementById('searchInput');

        // Enterキーで検索を実行
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        // 検索ボタンを押した時の処理
        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            document.getElementById('search-query-display').innerText = `「${query}」の検索結果`;
            renderResults();

            homeView.style.display = 'none';
            playerView.style.display = 'none';
            resultsView.style.display = 'block';
        }

        // 検索結果を描画する処理
        function renderResults() {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = ''; // 一旦クリア

            dummyVideos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                // サムネイル画像はYouTubeの公式仕様を利用して自動取得
                const thumbUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;

                card.innerHTML = `
                    <img src="${thumbUrl}" class="thumbnail" alt="thumbnail">
                    <div class="video-info">
                        <h4>${video.title}</h4>
                        <p>${video.channel} • ${video.views}</p>
                    </div>
                `;
                // クリックされたら動画再生画面へ移動
                card.onclick = () => playVideo(video);
                grid.appendChild(card);
            });
        }

        // 動画を再生する処理
        function playVideo(video) {
            resultsView.style.display = 'none';
            playerView.style.display = 'block';
            
            // iframeのsrcに /embed/動画ID を設定することで真っ暗にならず再生できる
            const iframe = document.getElementById('yt-player');
            iframe.src = `https://www.youtube.com/embed/${video.id}?autoplay=1`;
            
            // タイトルなどを更新
            document.getElementById('player-title').innerText = video.title;
            document.getElementById('player-channel').innerText = video.channel;
        }

        // 検索結果一覧に戻る処理
        function showResults() {
            // 動画の音声を止めるためiframeのsrcをリセット
            document.getElementById('yt-player').src = "";
            playerView.style.display = 'none';
            resultsView.style.display = 'block';
        }

        // 最初の検索画面に戻る処理
        function showHome() {
            document.getElementById('yt-player').src = "";
            resultsView.style.display = 'none';
            playerView.style.display = 'none';
            homeView.style.display = 'flex';
            searchInput.value = '';
        }
    </script>
</body>
</html>
